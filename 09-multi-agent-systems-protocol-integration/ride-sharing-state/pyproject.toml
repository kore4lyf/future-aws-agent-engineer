[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-sharing-state"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "boto3 >= 1.38.0",
    "botocore >= 1.38.0",
    "python-dotenv >= 1.2.1",
    "strands-agents >= 1.13.0",
    "strands-agents-tools >= 0.2.16",
]
