[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectrabank-architecture"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "boto3 >= 1.38.0",
    "botocore >= 1.38.0",
    "python-dotenv >= 1.2.1",
]

[project.optional-dependencies]
test = [
    "pytest >= 8.0.0",
]

[tool.setuptools]
py-modules = ["vectrabank_architecture"]

[tool.pytest.ini_options]
testpaths = ["test"]
