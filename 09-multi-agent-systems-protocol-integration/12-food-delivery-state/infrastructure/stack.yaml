AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB order-state table for food delivery shared-state exercise (optimistic locking)

Resources:
  OrderStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: order-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  OrderTableName:
    Value: !Ref OrderStateTable
  OrderTableArn:
    Value: !GetAtt OrderStateTable.Arn
