
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-browser-search-agent"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "bedrock-agentcore >= 1.0.3",
    "boto3 >= 1.38.0",
    "botocore >= 1.38.0",
    "mcp >= 1.19.0",
    "pydantic >= 2.0",
    "python-dotenv >= 1.2.1",
    "playwright >= 1.40",
    "nest-asyncio >= 1.5",
    "strands-agents >= 1.13.0",
    "strands-agents-tools >= 0.2.16"
]
