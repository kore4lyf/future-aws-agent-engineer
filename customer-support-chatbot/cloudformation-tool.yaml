AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Support Chatbot - Lambda, DynamoDB, and IAM Roles

Resources:
  BugReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bug-report-tool-stack-bug-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bug-report-tool-stack-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dynamodb-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt BugReportsTable.Arn

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bug-report-tool-stack-gateway-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CreateBugReportFunction.Arn

  HarnessExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bug-report-tool-stack-harness-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole

  CreateBugReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bug-report-tool-stack-create-bug-report
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import json
          import uuid
          import os
          from datetime import datetime

          dynamodb = boto3.resource("dynamodb", region_name="us-east-1")
          table_name = os.environ["BUG_REPORTS_TABLE"]
          table = dynamodb.Table(table_name)

          def lambda_handler(event, context):
              try:
                  description = event.get("description", "")
                  steps_to_reproduce = event.get("stepsToReproduce", "")
                  environment = event.get("environment", "")

                  ticket_id = f"BUG-{uuid.uuid4().hex[:8].upper()}"

                  item = {
                      "ticketId": ticket_id,
                      "description": description,
                      "stepsToReproduce": steps_to_reproduce,
                      "environment": environment,
                      "status": "OPEN",
                      "createdAt": datetime.utcnow().isoformat()
                  }

                  table.put_item(Item=item)

                  return {
                      "ticketId": ticket_id,
                      "status": "OPEN",
                      "message": f"Bug report {ticket_id} has been filed successfully."
                  }

              except Exception as e:
                  return {
                      "status": "error",
                      "message": f"Failed to create bug report: {str(e)}"
                  }
      Environment:
        Variables:
          BUG_REPORTS_TABLE: !Ref BugReportsTable

Outputs:
  BugReportsTableName:
    Value: !Ref BugReportsTable
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn
  HarnessExecutionRoleArn:
    Value: !GetAtt HarnessExecutionRole.Arn
  LambdaFunctionArn:
    Value: !GetAtt CreateBugReportFunction.Arn
