AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Support Chatbot - Bedrock Flow for message routing

Resources:
  # IAM Role for the Flow
  FlowExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-flow-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"

  # Bedrock Flow
  CustomerSupportFlow:
    Type: AWS::Bedrock::Flow
    Properties:
      Name: customer-support-flow
      Description: Classifies customer messages and routes to bug report, FAQ, or human support
      ExecutionRoleArn: !GetAtt FlowExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "nodes": [
            {
              "name": "Input",
              "type": "Input",
              "outputs": [
                {
                  "name": "document",
                  "type": "String"
                }
              ]
            },
            {
              "name": "Classifier",
              "type": "Prompt",
              "configuration": {
                "prompt": {
                  "sourceConfiguration": {
                    "inline": {
                      "modelId": "us.amazon.nova-pro-v1:0",
                      "templateType": "TEXT",
                      "templateConfiguration": {
                        "text": {
                          "template": "Classify the following customer message into exactly ONE category.\n\nCategories:\n- BUG_REPORT: The customer is reporting a problem, error, or issue with the platform.\n- PLATFORM_QUESTION: The customer is asking about orders, shipping, returns, or payments.\n- OTHER: The request does not fit either category above.\n\nCustomer message: {{input}}\n\nRespond with ONLY the category name (BUG_REPORT, PLATFORM_QUESTION, or OTHER). No other text.",
                          "inputVariables": [
                            {
                              "name": "input"
                            }
                          ]
                        }
                      }
                    }
                  }
                }
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.Input.document"
                }
              ],
              "outputs": [
                {
                  "name": "document",
                  "type": "String"
                }
              ]
            },
            {
              "name": "CategoryRouter",
              "type": "Condition",
              "configuration": {
                "condition": {
                  "conditions": [
                    {
                      "name": "isBugReport",
                      "expression": "$.Classifier.document == 'BUG_REPORT'"
                    },
                    {
                      "name": "isPlatformQuestion",
                      "expression": "$.Classifier.document == 'PLATFORM_QUESTION'"
                    }
                  ]
                }
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.Classifier.document"
                }
              ],
              "outputs": [
                {
                  "name": "document",
                  "type": "String"
                }
              ]
            },
            {
              "name": "BugReportPrompt",
              "type": "Prompt",
              "configuration": {
                "prompt": {
                  "sourceConfiguration": {
                    "inline": {
                      "modelId": "us.amazon.nova-pro-v1:0",
                      "templateType": "TEXT",
                      "templateConfiguration": {
                        "text": {
                          "template": "You are a customer support chatbot. The customer is reporting a bug. Collect the following details through conversation:\n\n**Required fields:**\n- **Bug description**: What is the problem?\n- **Steps to reproduce**: How can we reproduce this issue?\n- **Environment**: Browser, device, operating system, app version\n\n**Procedure:**\n1. Check what information you already have from the conversation.\n2. Ask for exactly ONE missing piece of information per turn.\n3. Once all three fields are collected, use the create_bug_report tool to file the ticket.\n4. After filing, respond with: \"Ticket filed: <ticket_id>\"\n5. Never fabricate details.\n\nCustomer message: {{input}}",
                          "inputVariables": [
                            {
                              "name": "input"
                            }
                          ]
                        }
                      }
                    }
                  }
                }
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.Input.document"
                }
              ],
              "outputs": [
                {
                  "name": "document",
                  "type": "String"
                }
              ]
            },
            {
              "name": "PlatformQuestionPrompt",
              "type": "Prompt",
              "configuration": {
                "prompt": {
                  "sourceConfiguration": {
                    "inline": {
                      "modelId": "us.amazon.nova-pro-v1:0",
                      "templateType": "TEXT",
                      "templateConfiguration": {
                        "text": {
                          "template": "You are a customer support chatbot. Answer the customer's question using ONLY the FAQ below. Do not make up answers.\n\n**FAQ Document:**\n\n**Orders**\n- Orders can be tracked via the \"My Orders\" page in your account dashboard.\n- Orders cannot be modified after 30 minutes of placement.\n- To cancel an order, go to My Orders > Select Order > Cancel Order.\n\n**Shipping**\n- Standard shipping: 3-5 business days.\n- Express shipping: 1-2 business days (additional fee applies).\n- Free shipping on orders over $50.\n- Shipping is available to all 50 US states.\n\n**Returns**\n- Returns accepted within 30 days of delivery.\n- Items must be unused and in original packaging.\n- Refunds are processed within 5-7 business days after return is received.\n- Return shipping is paid by the customer unless the item was defective.\n\n**Payments**\n- Accepted: Visa, Mastercard, American Express, PayPal, Apple Pay.\n- All transactions are encrypted and secure.\n- For payment issues, contact your bank first, then reach out to us.\n- Promotional codes must be applied at checkout — they cannot be added later.\n\n**If the FAQ does not cover the question, tell them you don't have that information and offer to connect them with human support.**\n\nCustomer message: {{input}}",
                          "inputVariables": [
                            {
                              "name": "input"
                            }
                          ]
                        }
                      }
                    }
                  }
                }
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.Input.document"
                }
              ],
              "outputs": [
                {
                  "name": "document",
                  "type": "String"
                }
              ]
            },
            {
              "name": "OtherRequestPrompt",
              "type": "Prompt",
              "configuration": {
                "prompt": {
                  "sourceConfiguration": {
                    "inline": {
                      "modelId": "us.amazon.nova-pro-v1:0",
                      "templateType": "TEXT",
                      "templateConfiguration": {
                        "text": {
                          "template": "You are a customer support chatbot. The customer's request does not fit bug reports or platform questions.\n\n1. Politely acknowledge the message.\n2. Explain that you can help with bug reports or platform questions (orders, shipping, returns, payments).\n3. Offer to connect them with human support at 1-800-555-0123 for other inquiries.\n4. Keep the response under 50 words.\n\nCustomer message: {{input}}",
                          "inputVariables": [
                            {
                              "name": "input"
                            }
                          ]
                        }
                      }
                    }
                  }
                }
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.Input.document"
                }
              ],
              "outputs": [
                {
                  "name": "document",
                  "type": "String"
                }
              ]
            },
            {
              "name": "BugReportOutput",
              "type": "Output",
              "configuration": {
                "output": {}
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.BugReportPrompt.document"
                }
              ]
            },
            {
              "name": "PlatformQuestionOutput",
              "type": "Output",
              "configuration": {
                "output": {}
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.PlatformQuestionPrompt.document"
                }
              ]
            },
            {
              "name": "OtherRequestOutput",
              "type": "Output",
              "configuration": {
                "output": {}
              },
              "inputs": [
                {
                  "name": "document",
                  "type": "String",
                  "expression": "$.OtherRequestPrompt.document"
                }
              ]
            }
          ],
          "connections": [
            {
              "name": "InputToClassifier",
              "source": "Input",
              "target": "Classifier",
              "type": "Data",
              "sourceOutput": "document",
              "targetInput": "document"
            },
            {
              "name": "ClassifierToRouter",
              "source": "Classifier",
              "target": "CategoryRouter",
              "type": "Data",
              "sourceOutput": "document",
              "targetInput": "document"
            },
            {
              "name": "RouterToBugReport",
              "source": "CategoryRouter",
              "target": "BugReportPrompt",
              "type": "Conditional",
              "sourceOutput": "document",
              "targetInput": "document",
              "condition": "isBugReport"
            },
            {
              "name": "RouterToPlatformQuestion",
              "source": "CategoryRouter",
              "target": "PlatformQuestionPrompt",
              "type": "Conditional",
              "sourceOutput": "document",
              "targetInput": "document",
              "condition": "isPlatformQuestion"
            },
            {
              "name": "RouterToOtherRequest",
              "source": "CategoryRouter",
              "target": "OtherRequestPrompt",
              "type": "Data",
              "sourceOutput": "document",
              "targetInput": "document"
            },
            {
              "name": "BugReportToOutput",
              "source": "BugReportPrompt",
              "target": "BugReportOutput",
              "type": "Data",
              "sourceOutput": "document",
              "targetInput": "document"
            },
            {
              "name": "PlatformQuestionToOutput",
              "source": "PlatformQuestionPrompt",
              "target": "PlatformQuestionOutput",
              "type": "Data",
              "sourceOutput": "document",
              "targetInput": "document"
            },
            {
              "name": "OtherRequestToOutput",
              "source": "OtherRequestPrompt",
              "target": "OtherRequestOutput",
              "type": "Data",
              "sourceOutput": "document",
              "targetInput": "document"
            }
          ]
        }

Outputs:
  FlowArn:
    Value: !GetAtt CustomerSupportFlow.Arn
    Description: ARN of the Bedrock Flow
  FlowId:
    Value: !Ref CustomerSupportFlow
    Description: ID of the Bedrock Flow
